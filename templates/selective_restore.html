<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureFace-RX | 선택적 복원</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Malgun Gothic', system-ui, sans-serif; background: #f1f5f9; color: #334155; }
        a { text-decoration: none; }

        .topbar { height: 62px; display:flex; justify-content:space-between; align-items:center; background:#0f172a; padding:0 24px; border-bottom:1px solid #1e293b; color:white; }
        .logo { font-weight:bold; font-size:18px; display:flex; align-items:center; gap:8px; }
        .topnav { display:flex; gap:24px; font-size:14px; }
        .topnav a { color:#cbd5e1; }
        .topnav .admin { color:#fff; font-weight:bold; }

        .adminbar { display:flex; gap:8px; align-items:center; padding:10px 24px; background:#0f172a; border-bottom:1px solid #1e293b; }
        .adminbar .label { color:#94a3b8; font-weight:600; margin-right:6px; font-size:14px; }
        .menu-btn { padding:7px 14px; border-radius:6px; background:#1e293b; color:#e2e8f0; font-size:14px; border:1px solid #334155; }
        .menu-btn.active { background:#3b82f6; color:#fff; border-color:#3b82f6; }
        .logout { margin-left:auto; padding:7px 14px; border-radius:6px; background:#475569; color:#fff; border:none; cursor:pointer; font-size:14px; }

        .page { padding:24px; display:flex; gap:24px; height:calc(100vh - 130px); max-width:1400px; margin:0 auto; }
        .chunk-panel { width:300px; background:white; border-radius:8px; box-shadow:0 1px 3px rgba(0,0,0,.1); padding:20px; overflow-y:auto; border:1px solid #e2e8f0; }
        .chunk-head { display:flex; align-items:center; justify-content:space-between; border-bottom:2px solid #f1f5f9; padding-bottom:12px; }
        .chunk-head h3 { margin:0; color:#1e293b; font-size:16px; }
        .refresh { border:1px solid #cbd5e1; background:#fff; border-radius:6px; padding:7px 10px; cursor:pointer; color:#475569; }
        .folder-date { font-weight:600; margin-top:15px; color:#475569; border-bottom:1px solid #e2e8f0; padding-bottom:5px; font-size:14px; }
        .folder-time { margin-left:10px; padding:8px; cursor:pointer; color:#64748b; transition:.2s; border-radius:6px; font-size:14px; margin-top:5px; }
        .folder-time:hover, .folder-time.selected { background:#e2e8f0; color:#0f172a; font-weight:bold; }
        .empty { color:#94a3b8; font-size:14px; margin-top:20px; text-align:center; }

        .viewer-panel { flex:1; background:white; border-radius:8px; box-shadow:0 1px 3px rgba(0,0,0,.1); padding:30px; border:1px solid #e2e8f0; display:flex; flex-direction:column; align-items:center; overflow:auto; }
        .initial { margin-top:150px; text-align:center; color:#94a3b8; }
        .initial .icon { font-size:48px; margin-bottom:16px; }
        .initial h3 { font-weight:500; }
        .viewer-active { display:none; width:100%; max-width:640px; }
        .selected-title { color:#0f172a; margin-top:0; border-bottom:2px solid #f1f5f9; padding-bottom:12px; margin-bottom:24px; }

        .password-card { background:#f8fafc; padding:24px; border-radius:8px; border:1px solid #e2e8f0; margin-bottom:24px; text-align:center; }
        .password-card label { display:block; font-weight:600; color:#475569; margin-bottom:12px; }
        .password-row { display:flex; gap:10px; justify-content:center; }
        input[type="password"] { padding:10px 15px; width:280px; border:1px solid #cbd5e1; border-radius:6px; outline:none; font-size:14px; }
        input[type="password"]:focus { border-color:#3b82f6; box-shadow:0 0 0 3px rgba(59,130,246,.1); }
        .btn-restore { padding:10px 20px; background:#3b82f6; color:white; border:none; border-radius:6px; cursor:pointer; font-weight:bold; transition:.2s; }
        .btn-restore:hover { background:#2563eb; }
        .btn-restore:disabled { opacity:.6; cursor:not-allowed; }

        .hint { margin-top:12px; color:#64748b; font-size:12px; line-height:1.5; }
        .status { font-weight:bold; margin-bottom:14px; text-align:center; font-size:15px; min-height:20px; white-space:pre-line; }
        .result-video { width:100%; max-height:calc(100vh - 440px); object-fit:contain; border-radius:8px; display:none; box-shadow:0 4px 6px rgba(0,0,0,.05); border:1px solid #e2e8f0; margin:0 auto; background:#000; }
        .download { display:none; width:max-content; margin:12px auto 0; padding:9px 14px; border-radius:6px; background:#16a34a; color:white; font-weight:600; }

        @media (max-width:850px) {
            .page { height:auto; flex-direction:column; }
            .chunk-panel { width:100%; max-height:320px; }
            .password-row { flex-direction:column; }
            input[type="password"] { width:100%; }
            .adminbar { flex-wrap:wrap; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="logo">🔒 SecureFace-RX</div>
        <nav class="topnav">
            <a href="/">실시간 모니터링</a>
            <a href="/assets">보호 자산</a>
            <a class="admin" href="/employees">관리자</a>
        </nav>
    </header>

    <nav class="adminbar" aria-label="관리자 메뉴">
        <span class="label">관리자 메뉴</span>
        <a class="menu-btn" href="/employees">👥 사원 관리</a>
        <a class="menu-btn" href="/register">＋ 사원 등록</a>
        <a class="menu-btn" href="/audit">📋 감사 로그</a>
        <a class="menu-btn" href="/decryption_page">🗂️ 원본 복원</a>
        <a class="menu-btn active" href="/selective/">선택적 복원</a>
        <button id="logout" class="logout">🚪 로그아웃</button>
    </nav>

    <main class="page">
        <aside class="chunk-panel">
            <div class="chunk-head">
                <h3>녹화 청크 (raw_data)</h3>
                <button id="refresh" class="refresh">새로고침</button>
            </div>
            <div id="chunkList"><div class="empty">불러오는 중…</div></div>
        </aside>

        <section class="viewer-panel">
            <div id="viewerInitial" class="initial">
                <div class="icon">📁</div>
                <h3>좌측에서 복원할 청크를 선택하세요</h3>
            </div>

            <div id="viewerActive" class="viewer-active">
                <h3 id="selectedChunkTitle" class="selected-title">선택된 청크:</h3>

                <div class="password-card">
                    <label for="restorePassword">선택적 복원 비밀번호</label>
                    <div class="password-row">
                        <input type="password" id="restorePassword" maxlength="32" autocomplete="off" placeholder="비밀번호를 입력하세요">
                        <button id="restoreButton" class="btn-restore">복원 실행</button>
                    </div>
                    <div class="hint">외부인 비밀번호는 외부인 얼굴만, 내부인 비밀번호는 등록된 허가자 얼굴만 복원합니다.</div>
                </div>

                <div id="restoreStatus" class="status"></div>
                <video id="restoredVideo" class="result-video" controls autoplay></video>
                <a id="download" class="download">복원 영상 다운로드</a>
            </div>
        </section>
    </main>

    <script>
        const csrf = '__CSRF__';
        const el = id => document.getElementById(id);
        let rows = [];
        let selected = null;
        let currentObjectUrl = null;

        async function api(path, opts = {}) {
            const response = await fetch(path, opts);
            let payload = {};
            try { payload = await response.json(); } catch (_) {}
            if (!response.ok) throw new Error(payload.detail || '요청 실패');
            return payload;
        }

        function displayName(row) {
            const path = String(row.name || row.path || '');
            const parts = path.split('/');
            if (parts.length >= 3) return parts.slice(-2).join('/');
            return path || String(row.started_at || '').slice(11, 19).replaceAll(':', '-');
        }

        function renderChunks() {
            const container = el('chunkList');
            container.replaceChildren();
            if (!rows.length) {
                container.innerHTML = '<div class="empty">저장 완료된 녹화 청크가 없습니다.</div>';
                return;
            }

            let lastDate = null;
            for (const row of rows) {
                const date = row.date || String(row.started_at || '').slice(0, 10) || '-';
                if (date !== lastDate) {
                    const header = document.createElement('div');
                    header.className = 'folder-date';
                    header.textContent = '📅 ' + date;
                    container.appendChild(header);
                    lastDate = date;
                }

                const item = document.createElement('div');
                item.className = 'folder-time' + (selected && selected.id === row.id ? ' selected' : '');
                item.textContent = '🕒 ' + displayName(row);
                item.onclick = () => selectChunk(row);
                container.appendChild(item);
            }
        }

        async function refreshChunks() {
            const keep = selected && selected.id;
            rows = await api('/selective/api/chunks');
            selected = rows.find(row => row.id === keep) || null;
            renderChunks();
            if (!selected) showInitial();
        }

        function showInitial() {
            el('viewerInitial').style.display = 'block';
            el('viewerActive').style.display = 'none';
        }

        function resetResult() {
            el('restoreStatus').textContent = '';
            el('restoredVideo').pause();
            el('restoredVideo').removeAttribute('src');
            el('restoredVideo').style.display = 'none';
            el('download').style.display = 'none';
            el('download').removeAttribute('href');
            if (currentObjectUrl) {
                URL.revokeObjectURL(currentObjectUrl);
                currentObjectUrl = null;
            }
        }

        function selectChunk(row) {
            selected = row;
            renderChunks();
            el('viewerInitial').style.display = 'none';
            el('viewerActive').style.display = 'block';
            el('selectedChunkTitle').textContent = '선택된 청크: ' + displayName(row);
            el('restorePassword').value = '';
            resetResult();
            el('restorePassword').focus();
        }

        function roleText(role) {
            if (role === 'external') return '외부인';
            if (role === 'internal') return '내부인';
            return '선택적';
        }

        async function requestRestore() {
            const status = el('restoreStatus');
            const button = el('restoreButton');
            try {
                if (!selected) throw new Error('복원할 청크를 선택하세요.');
                const password = el('restorePassword').value;
                if (!password) throw new Error('비밀번호를 입력해주세요.');

                resetResult();
                button.disabled = true;
                status.style.color = '#d97706';
                status.textContent = '⏳ 비밀번호를 확인하고 복원 작업을 등록하는 중입니다...';

                const body = new TextEncoder().encode(password);
                const job = await api('/selective/api/restore/' + selected.id, {
                    method: 'POST',
                    headers: {
                        'X-SRX-CSRF': csrf,
                        'Content-Type': 'application/octet-stream'
                    },
                    body
                });
                el('restorePassword').value = '';
                await pollRestore(job.job);
            } catch (error) {
                status.style.color = '#dc2626';
                status.textContent = '❌ ' + error.message;
            } finally {
                button.disabled = false;
            }
        }

        async function pollRestore(jobId) {
            const status = el('restoreStatus');
            while (true) {
                const job = await api('/selective/api/jobs/' + jobId);
                if (job.status === 'failed') throw new Error(job.error || '복원 실패');

                if (job.status === 'running') {
                    status.style.color = '#d97706';
                    status.textContent = `⏳ ${roleText(job.role)} 비밀번호 인증 완료\n복원 영상을 생성하는 중입니다... (${job.progress || 0}%)`;
                    await new Promise(resolve => setTimeout(resolve, 500));
                    continue;
                }

                if (job.status === 'complete') {
                    const video = el('restoredVideo');
                    const source = `/selective/api/jobs/${jobId}/download?inline=1&t=${Date.now()}`;
                    video.src = source;
                    video.style.display = 'block';
                    video.load();
                    video.play().catch(() => {});

                    const download = el('download');
                    download.href = `/selective/api/jobs/${jobId}/download`;
                    download.style.display = 'block';
                    status.style.color = '#16a34a';
                    status.textContent = `✅ ${roleText(job.role)} 선택 복원이 완료되었습니다.`;
                    return;
                }

                await new Promise(resolve => setTimeout(resolve, 500));
            }
        }

        el('restoreButton').onclick = requestRestore;
        el('restorePassword').addEventListener('keydown', event => {
            if (event.key === 'Enter') requestRestore();
        });
        el('refresh').onclick = () => refreshChunks().catch(error => {
            el('chunkList').innerHTML = '<div class="empty">' + error.message + '</div>';
        });
        el('logout').onclick = () => fetch('/api/admin/logout', { method:'POST' }).then(() => location.href='/admin/login');

        const requested = new URLSearchParams(location.search).get('chunk');
        refreshChunks().then(() => {
            if (requested) {
                const row = rows.find(item => item.id === requested);
                if (row) selectChunk(row);
            }
        }).catch(error => {
            el('chunkList').innerHTML = '<div class="empty">' + error.message + '</div>';
        });
    </script>
</body>
</html>
